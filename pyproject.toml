[tool.poetry]
name = "ai-harness"
version = "0.1.0"
description = "A minimal FastAPI service."
authors = ["AI Harness Contributors"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.162,<0.163"
uvicorn = { extras = ["standard"], version = ">=0.54,<0.55" }
pydantic = "^2.14.2"
langchain-openai = "^1.7.3"
langchain-ollama = "^1.1.0"
mysql-connector-python = "^9.0.0"
python-dotenv = "^1.2.4"
mcp = ">=2.2,<3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
